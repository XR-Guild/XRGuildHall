<!doctype html>
<html><head><meta charset="utf-8"><title>Guild Hall export</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" />
</head><body><pre id="log">exporting…</pre>
<script type="module">
import { runExport } from '/src/export.ts';
const el = document.getElementById('log');
window.__startExport = async () => {
  await Promise.race([Promise.all(['40px "Marcellus SC"', '40px "Alegreya Sans"', '600 40px "Alegreya Sans"', '40px "IBM Plex Mono"', '600 40px "IBM Plex Mono"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 5000))]);
  const log = s => { el.textContent += '\n' + s; console.log(s); };
  return await runExport((n, b) => window.saveFile(n, b), log);
};
</script></body></html>
